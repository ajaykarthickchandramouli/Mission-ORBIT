<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title> Mission  ORBIT P1</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="heading">Mission ORBIT Prototype - 1</h1>
        <p id="dist">Distance  to be achieved: 500km</p>
        <p id="accinp">Acceleration(in m/s^2):</p>
        <input type="number" id="acceleration" step="any">
        <p id="timeinp">Time(in s):</p>
        <input type="number" id="time" step="any">
        <button id="sub">Submit Inputs</button>
        <p id="formulas">Formulas to be used:<br>
        s = (a - 10ms^-2)xt^2/2<br>
        F(u) = axt<br>
        Initial fuel is set at 235units.</p>
        <p id="rs">Rocket Status: Not launched yet!</p>
        <script src="script.js"></script>
    </body>
</html>
